<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>艺人档案 | PerthSanta</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{
            background:#111;color:#fff;padding-top:70px;
            background-image:radial-gradient(#380f0f,#111,#222);
            background-attachment:fixed;min-height:100vh;
        }
        .header-nav{
            position:fixed;top:0;left:0;width:100%;
            background:rgba(15,10,10,0.95);
            border-bottom:1px solid #661c24;
            z-index:1000;padding:16px 20px;
            overflow-x:auto;white-space:nowrap;
        }
        .header-nav a{color:#eee;text-decoration:none;margin:0 10px;font-size:14px;}
        .header-nav a.active{color:#e62b3b;font-weight:bold;}
        .container{max-width:920px;margin:0 auto;padding:20px;}
        h1{text-align:center;color:#e62b3b;margin-bottom:30px;}
        .card-wrap{display:grid;grid-template-columns:repeat(auto-fit, minmax(260px,1fr));gap:20px;}
        .artist-card{
            background:rgba(40,15,15,0.6);border:1px solid #552222;border-radius:14px;
            padding:18px;cursor:pointer;transition:0.3s;
        }
        .artist-card:hover{border-color:#e62b3b;background:rgba(60,18,18,0.7);}
        .avatar{width:100%;aspect-ratio:1;object-fit:contain;background:#000;border-radius:10px;margin-bottom:12px;}
        .artist-name{font-size:20px;margin-bottom:6px;color:#ffaaaa;}
        .artist-desc{font-size:14px;color:#ddd;line-height:1.6;}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;padding:30px;overflow-y:auto;}
        .modal-content{max-width:850px;margin:0 auto;background:#1a1111;border-radius:16px;padding:24px;}
        .close{float:right;font-size:32px;cursor:pointer;color:#fff;line-height:1;}
        .modal-img{width:100%;object-fit:contain;max-height:70vh;margin:12px 0;border-radius:8px;background:#000;}
        .modal h2{color:#e62b3b;margin-bottom:8px;}
        .modal p{line-height:1.8;color:#eee;white-space:pre-wrap;}
        .loading{text-align:center;color:#888;padding:40px;}
    </style>
</head>
<body>
    <div class="header-nav">
        <a href="index.html">首页</a>
        <a href="artists.html" class="active">艺人档案</a>
        <a href="schedule.html">行程表</a>
        <a href="drama.html">心之所归</a>
    </div>
    <div class="container">
        <h1>艺人档案</h1>
        <div class="card-wrap" id="artistList">
            <div class="loading">加载中...</div>
        </div>
    </div>
    <div id="modalWrap"></div>

    <script>
        function openModal(id){document.getElementById('modal'+id).style.display='block';window.scrollTo(0,0);}
        function closeModal(id){document.getElementById('modal'+id).style.display='none';}
        window.onclick=e=>{if(e.target.classList.contains('modal'))e.target.style.display='none';};

        fetch('data.json')
            .then(r=>r.json())
            .then(data=>{
                const list = data.artists || [];
                const wrap = document.getElementById('artistList');
                const modalWrap = document.getElementById('modalWrap');
                if(list.length===0){wrap.innerHTML='<div class="loading">暂无艺人数据，请在 TinaCMS 后台录入</div>';return;}

                wrap.innerHTML = list.map((a,i)=>`
                    <div class="artist-card" onclick="openModal(${i})">
                        <img class="avatar" src="${a.avatarUrl||''}" alt="${a.name||''}">
                        <div class="artist-name">${a.name||'未命名'}</div>
                        <div class="artist-desc">${a.profession||''}</div>
                    </div>
                `).join('');

                modalWrap.innerHTML = list.map((a,i)=>{
                    const extraImgs = (a.extraImages||'').split('\n').filter(s=>s.trim());
                    return `
                    <div class="modal" id="modal${i}">
                        <div class="modal-content">
                            <span class="close" onclick="closeModal(${i})">&times;</span>
                            <h2>${a.name||''}</h2>
                            <p style="color:#ffaaaa">${a.profession||''}</p>
                            <img class="modal-img" src="${a.avatarUrl||''}">
                            <p>${a.body||''}</p>
                            <p style="white-space:pre-wrap;color:#aaa;margin-top:12px">${a.socialMedia||''}</p>
                            ${extraImgs.map(u=>`<img class="modal-img" src="${u.trim()}">`).join('')}
                        </div>
                    </div>`;
                }).join('');
            })
            .catch(err=>{
                document.getElementById('artistList').innerHTML='<div class="loading">加载失败，请确认 data.json 已生成</div>';
            });
    </script>
</body>
</html>
